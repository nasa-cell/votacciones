<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Azul y blanco en PC</title><style>body{margin:0;background:#eef1f8;color:#0e1b3d;font:15px system-ui,sans-serif}header{background:linear-gradient(120deg,#0b1f4d,#1d3fa0);color:#fff;padding:22px 20px}header h1{margin:0 0 4px;font-size:22px}header p{margin:0;color:#c4d0f5}main{max-width:1500px;margin:0 auto;padding:18px 16px 40px}h2{font-size:17px;margin:18px 0 10px}.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:18px}figure{margin:0;background:#fff;border-radius:14px;box-shadow:0 8px 24px rgba(14,27,61,.1);overflow:hidden}figure img{display:block;width:100%;height:270px;object-fit:cover;object-position:top;border-bottom:1px solid #e3e8f4}figcaption{padding:10px 14px;font-weight:600}figcaption b{display:inline-block;background:#ffc83d;color:#0b1f4d;border-radius:6px;padding:0 6px;margin-right:6px;font-size:13px}@media(max-width:480px){.g{grid-template-columns:1fr}}</style></head><body><header><h1>Azul y blanco · todas las páginas en PC</h1><p>Capturas reales de la app (pantalla de 1366 px) con fondo blanco, azul en el menú y los botones, y dorado y verde de detalle. Toca una imagen para verla entera.</p></header><main><h2>🗳 Votante</h2><div class="g"><figure><a href="capturas-pc/01-registro.png" target="_blank"><img src="capturas-pc/01-registro.png" loading="lazy" alt="Registro"></a><figcaption><b>01</b> Registro</figcaption></figure><figure><a href="capturas-pc/02-registro-avisos.png" target="_blank"><img src="capturas-pc/02-registro-avisos.png" loading="lazy" alt="Registro con avisos en rojo"></a><figcaption><b>02</b> Registro con avisos en rojo</figcaption></figure><figure><a href="capturas-pc/03-elegir-partido.png" target="_blank"><img src="capturas-pc/03-elegir-partido.png" loading="lazy" alt="Elegir partido"></a><figcaption><b>03</b> Elegir partido</figcaption></figure><figure><a href="capturas-pc/04-c
